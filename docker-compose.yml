services:
  app:
    image: ghcr.io/tigerowo/infinite-canvas:latest
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: always
    container_name: ${CONTAINER_NAME:-infinite-canvas}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:3000"
    restart: unless-stopped
